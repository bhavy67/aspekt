<!-- ASPEKT logo mark — viewfinder crop-bracket with gradient stroke -->
<!-- Usage sizes: 16px (nav compact), 20px (nav), 32px (favicon), 48px (splash), 80px+ (marketing) -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" fill="none">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>
  </defs>
  <path d="M4,14 L4,4 L14,4" stroke="url(#grad)" stroke-width="2.5" stroke-linecap="square"/>
  <path d="M26,4 L36,4 L36,14" stroke="url(#grad)" stroke-width="2.5" stroke-linecap="square"/>
  <path d="M4,26 L4,36 L14,36" stroke="url(#grad)" stroke-width="2.5" stroke-linecap="square"/>
  <path d="M26,36 L36,36 L36,26" stroke="url(#grad)" stroke-width="2.5" stroke-linecap="square"/>
</svg>
